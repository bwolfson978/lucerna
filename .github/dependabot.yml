# Keeps the PostHog SDKs and Playwright current. PostHog's SDK health page flags
# old versions; a stale Playwright stops installing browsers when GitHub moves
# ubuntu-latest to a newer Ubuntu (it broke CI on the 26.04 switch in 2026-11).
# Each entry gets one grouped PR a week, and a release must be 3 days old before
# Dependabot proposes it, the safety window PostHog recommends after the
# Shai-Hulud npm attack:
# https://posthog.com/docs/health-checks/keeping-sdks-current
# Green PRs merge themselves via .github/workflows/dependabot-auto-merge.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-name: posthog-js
      - dependency-name: posthog-node
      - dependency-name: '@posthog/*'
    groups:
      posthog:
        patterns: ['*']
    commit-message:
      prefix: deps

  # posthog stays an exact pin (posthog.mcp is beta); Dependabot moves the pin
  # and the backend tests exercise the MCP analytics instrumentation.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-name: posthog
    groups:
      posthog:
        patterns: ['*']
    commit-message:
      prefix: deps

  # Playwright drives the ui-drift CI job and the pr-evidence screenshots. Each
  # release adds browser builds for new Ubuntu versions, so keeping it current
  # keeps CI working on ubuntu-latest.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-name: '@playwright/test'
    groups:
      playwright:
        patterns: ['*']
    commit-message:
      prefix: deps
