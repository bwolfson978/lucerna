name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - run: python -m pytest tests/ -v --cov=app

  mcp-views:
    # MCP App Views are built into backend/app/mcp/views/ and committed (the backend
    # image has no Node). Fail if the committed bundle is out of date with its source.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-views
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-views/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Built Views match their source
        run: git diff --exit-code -- ../backend/app/mcp/views

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - run: npm run test:run

  ui-drift:
    # The shared result card (ui/) rendered natively and as the MCP App View must look
    # the same. Runs only the drift check, against the offline stand-in model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - run: pip install -r requirements.txt && pip install -e .
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test ui-drift.spec.ts --reporter=list
        working-directory: e2e
