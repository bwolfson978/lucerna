name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - run: python -m pytest tests/ -v --cov=app

  mcp-views:
    # MCP App Views are built into backend/app/mcp/views/ and committed (the backend
    # image has no Node). Fail if the committed bundle is out of date with its source.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-views
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-views/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Built Views match their source
        run: git diff --exit-code -- ../backend/app/mcp/views

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - run: npm run test:run

  ui-drift:
    # MCP App Views end to end, against the offline stand-in model: shared cards (ui/)
    # look the same natively and as Views, the scenario View renders, and a View's
    # "See full results" link opens on the site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - run: pip install -r requirements.txt && pip install -e .
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test ui-drift.spec.ts scenario-view.spec.ts results-link.spec.ts --reporter=list
        working-directory: e2e

  formal:
    # The TLA+ and Lean models in formal/ (see the formal-models skill). Runs when a PR
    # touches a file in formal/paths.yml, and on every push to master. Every invariant
    # must hold and every proof must build without `sorry`; there are no expected failures.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: formal/paths.yml

      - id: run
        run: echo "models=${{ github.event_name == 'push' || steps.filter.outputs.changes != '[]' }}" >> "$GITHUB_OUTPUT"

      - name: Models whose code changed without the model
        if: github.event_name == 'pull_request' && steps.run.outputs.models == 'true'
        run: |
          .agents/skills/formal-models/scripts/affected.sh "origin/${{ github.base_ref }}" | tee affected.txt
          grep '^drift: ' affected.txt | sed 's/^drift: //' | while read -r line; do
            echo "::warning title=Formal model not updated::$line. Update the model, or say why it is unaffected in the PR's Formal models section."
            echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/setup-java@v4
        if: steps.run.outputs.models == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v4
        if: steps.run.outputs.models == 'true'
        with:
          path: ~/tools/tla2tools.jar
          key: tla2tools-v1.8.0

      - name: Install TLC and elan
        if: steps.run.outputs.models == 'true'
        run: |
          .agents/skills/formal-models/scripts/install.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: TLC, every invariant
        if: steps.run.outputs.models == 'true'
        run: formal/tla/check.sh

      - name: Lean proofs
        if: steps.run.outputs.models == 'true'
        working-directory: formal/lean
        run: lake build --wfail

      - name: Upload TLC counterexamples
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-logs
          path: formal/tla/out/*.log
          if-no-files-found: ignore
