<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--background, #fafafa); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; }
  svg { position: absolute; inset: 0; }
  .warm { fill: var(--paper-warm, #f0ede6); }
  .slab { fill: var(--pine-deep, #0b1d15); }
  .b1 { fill: var(--pine-mid, #2d6a4f); }
  .b2 { fill: var(--sage, #66a183); }
  .b3 { fill: var(--pine-haze, #b9c9bd); }
  .next { fill: none; stroke: var(--sage, #66a183); stroke-width: 2; stroke-dasharray: 7 5; }
  .ember { fill: var(--ember, #f26522); }
  .rule { stroke: var(--pine-line, #1e3a2e); stroke-width: 1; }
  .r-lg { rx: var(--radius-lg, 20px); }
  .r-sm { rx: var(--radius-sm, 8px); }
  .text { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif, "Playfair Display", Georgia, serif); font-weight: 600; font-size: 100px; line-height: 0.95; letter-spacing: -0.015em; color: var(--foreground, #141414); }
  .name em { color: var(--pine, #1b4332); }
  .tag { margin: 16px 0 0; font-family: var(--font-sans, "Inter", system-ui, sans-serif); font-size: 14px; line-height: 1.4; color: var(--muted-foreground, #3d3d3d); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: pine-deep slab 368x268 bleeding off top and right (radius-lg); paper-warm 96x160 (radius-lg); ember 32x32 (radius-sm), kept small because ember only means cost.
      arrangement: one tall slab with satellites, everything right of x=480.
      pattern: literal motif, rising bars from the mark ("conversions climbing into room left"): pine-mid, sage, pine-haze, then a dashed sage outline for the year to come.
      scales: bar width 48 (space-section-lg), gap 16 (space-default), steps of 48 in height, bar corners radius-sm, slab and tile corners radius-lg; baseline rule in pine-line.
    -->
    <rect class="warm r-lg" x="480" y="112" width="96" height="160"/>
    <rect class="ember r-sm" x="512" y="232" width="32" height="32"/>
    <rect class="slab r-lg" x="592" y="-20" width="388" height="268"/>
    <line class="rule" x1="624" y1="216" x2="960" y2="216"/>
    <rect class="b1 r-sm" x="640" y="168" width="48" height="48"/>
    <rect class="b2 r-sm" x="704" y="120" width="48" height="96"/>
    <rect class="b3 r-sm" x="768" y="72" width="48" height="144"/>
    <rect class="next r-sm" x="833" y="25" width="46" height="190"/>
  </svg>
  <div class="text">
    <h1 class="name">Paper &amp; <em>Pine</em></h1>
    <p class="tag">A calm planning tool that shows how the tax code works.</p>
  </div>
</div>
</body>
</html>
