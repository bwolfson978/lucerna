<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0;padding:24px}</style>
</head>
<body class="bg-bg font-sans text-body text-text-primary antialiased">
<div id="root"></div>
<script>
(function(){
var h=React.createElement, U=window.LucernaUI, noop=function(){};
function F(p){return h('div',{className:'flex flex-col gap-1.5'},h(U.Label,{htmlFor:p.id},p.l),h(U.Input,Object.assign({id:p.id},p.i)));}
function App(){return h('div',{className:'grid max-w-xl grid-cols-1 gap-default sm:grid-cols-2'},h(F,{id:'a',l:'Your age',i:{numeric:true,defaultValue:'58'}}),h(F,{id:'b',l:'Traditional IRA/401(k) balance',i:{numeric:true,placeholder:'$500,000'}}),h(F,{id:'c',l:'Email',i:{type:'email',placeholder:'you@example.com'}}),h(F,{id:'d',l:'State',i:{disabled:true,defaultValue:'Massachusetts'}}));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
