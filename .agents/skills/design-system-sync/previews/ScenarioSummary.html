(function(){

function App(){var s=React.useState(F.scenario.scenario), t=React.useState(Object.assign({},F.scenario.scenario,{birth_year:null,birth_month:null,state:null}));

 h('div',{className:'w-full max-w-[640px]'},h(U.ScenarioSummary,{data:Object.assign({},F.scenario,{scenario:s[0]}),onRun:noop,onOpenForm:noop,onEdit:edit(s[1])})),
 h('div',{className:'border-border w-full max-w-[400px] border'},h(U.ScenarioSummary,{variant:'panel',data:Object.assign({},F.scenario,{scenario:t[0]}),highlight:['traditional_balance','retirement_age'],onOpenForm:noop,onEdit:edit(t[1])})));}
