<!-- @dsCard group="Shared cards" height=362 subtitle="Default, positive and negative tones, with notes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0;padding:24px}</style>
</head>
<body class="bg-bg font-sans text-body text-text-primary antialiased">
<div id="root"></div>
<script>
(function(){
var h=React.createElement, U=window.LucernaUI, noop=function(){};
function App(){return h('div',{className:'flex flex-col gap-default'},
 h('div',{className:'card grid max-w-md grid-cols-3 gap-default'},
  h(U.Stat,{label:'Tax on conversion',value:'$22,000'}),
  h(U.Stat,{label:'Saved',value:'$86,301',tone:'positive'}),
  h(U.Stat,{label:'Lost',value:'-$4,259',tone:'negative'})),
 h('div',{className:'card grid max-w-xl grid-cols-2 gap-x-3 gap-y-5 sm:grid-cols-4'},
  h(U.Stat,{label:'Subsidy kept',value:'$18,400',note:'after conversions'}),
  h(U.Stat,{label:'Subsidy reduced by',value:'$3,200',tone:'negative',note:'across 2 years'}),
  h(U.Stat,{label:'True cost of conversions',value:'$24,900',note:'federal tax + subsidy loss'}),
  h(U.Stat,{label:'Combined rate',value:'17.8%',note:'tax + subsidy per dollar converted'})));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
