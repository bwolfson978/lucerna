<!-- @dsCard group="UI" height=256 subtitle="Default, recommended and current" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0;padding:24px}</style>
</head>
<body class="bg-bg font-sans text-body text-text-primary antialiased">
<div id="root"></div>
<script>
(function(){
var h=React.createElement, U=window.LucernaUI, noop=function(){};
function C(p){return h(U.Card,{recommended:p.r,current:p.c},h(U.CardHeader,null,h(U.CardTitle,null,p.t),h(U.CardDescription,null,p.d)),h(U.CardContent,{className:'pt-default'},h('span',{className:'metric-value'},p.v)));}
function App(){return h('div',{className:'grid grid-cols-1 gap-default sm:grid-cols-3'},h(C,{t:'No conversion',d:'Leave the balance pre-tax',v:'$0'}),h(C,{r:true,t:'Recommended',d:'Fill the 22% bracket for 4 years',v:'$86,301'}),h(C,{c:true,t:'Your selection',d:'Fill the 12% bracket only',v:'$41,820'}));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
