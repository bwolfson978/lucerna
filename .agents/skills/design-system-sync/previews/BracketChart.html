<!-- @dsCard group="Shared cards" height=551 subtitle="Income, RMDs and conversions stacked against the brackets" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0;padding:24px}</style>
</head>
<body class="bg-bg font-sans text-body text-text-primary antialiased">
<div id="root"></div>
<script>
(function(){
var h=React.createElement, U=window.LucernaUI, noop=function(){};
/*@fixture bracketFill*/
const d=F.bracketFill;
function App(){return h('div',{className:'card'},h(U.BracketChart,{years:d.years.map(function(y){return {year:y.year,age:y.age,income:y.income,rmdAmount:y.rmd,conversion:y.conversion};}),brackets:d.brackets,standardDeduction:d.standard_deduction,addedTax:d.years.map(function(y){return y.tax;}),fixedHeight:true}));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
