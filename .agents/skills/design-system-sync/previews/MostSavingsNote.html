<!-- @dsCard group="Shared cards" height=230 subtitle="At the most savings, and at another amount with the way back" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>body{margin:0;padding:24px}</style>
</head>
<body class="bg-bg font-sans text-body text-text-primary antialiased">
<div id="root"></div>
<script>
(function(){
var h=React.createElement, U=window.LucernaUI, noop=function(){};
function Tile(p){return h('div',{className:'card flex flex-col gap-1.5'},h('span',{className:'eyebrow'},'Estimated lifetime tax savings'),h('span',{className:'metric-value-hero text-pine'},p.value),h(U.MostSavingsNote,p.note));}
function App(){return h('div',{className:'grid grid-cols-1 gap-default sm:grid-cols-2'},
 h(Tile,{value:'$36,990',note:{atOptimal:true,shortfall:0,caption:"in today's dollars, compared with not converting"}}),
 h(Tile,{value:'$32,780',note:{atOptimal:false,shortfall:4210,onBack:noop}}));}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
